name: Fetch Supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and push artifacts
        env:
          SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrbmR6YmtjbWdmYWlsdHh1d2llIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjE5NjgzOSwiZXhwIjoyMTA3NzcyODM5fQ.v9SQ7mdwpCPNqA4sAhZ8b16gP5m_8Kb9UUJgocSSOiI
        run: |
          git config user.email "arena@arena.ai"
          git config user.name "Arena"
          mkdir -p /tmp/dl
          echo "Downloading Godot parts..."
          for f in Godot_v4.7.2-stable_linux.x86_64.zip.001 Godot_v4.7.2-stable_linux.x86_64.zip.002 Godot_v4.7.2-stable_linux.x86_64.zip.003; do
            curl -s -L -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" "https://tkndzbkcmgfailtxuwie.supabase.co/storage/v1/object/DEADLOCK%20OUTBREAK/$f" -o "/tmp/dl/$f"
          done
          echo "Downloading Blender parts..."
          for i in $(seq 1 11); do
            f2=$(printf "blender-4.5.14-linux-x64.tar.zip.%03d" $i)
            curl -s -L -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" "https://tkndzbkcmgfailtxuwie.supabase.co/storage/v1/object/DEADLOCK%20OUTBREAK/$f2" -o "/tmp/dl/$f2"
          done
          ls -lh /tmp/dl/
          echo "Reconstructing..."
          cat /tmp/dl/Godot_v4.7.2-stable_linux.x86_64.zip.* > /tmp/godot_full.zip
          cat /tmp/dl/blender-4.5.14-linux-x64.tar.zip.* > /tmp/blender_full.tar.zip
          ls -lh /tmp/*.zip
          # Split blender into 95M chunks for git push (<100M limit)
          split -b 95M /tmp/blender_full.tar.zip /tmp/blender_part_
          ls -lh /tmp/blender_part_* /tmp/godot_full.zip
          # Create artifacts branch
          git checkout --orphan artifacts/godot-blender
          git rm -rf . || true
          mkdir -p artifacts
          cp /tmp/godot_full.zip artifacts/godot_full.zip
          cp /tmp/blender_part_* artifacts/
          ls -lh artifacts/
          git add artifacts/
          git commit -m "Add Godot and Blender artifacts"
          git push -f origin artifacts/godot-blender
          echo "Pushed to artifacts/godot-blender"
      - name: Upload artifact fallback
        uses: actions/upload-artifact@v4
        with:
          name: godot-full
          path: /tmp/godot_full.zip
          retention-days: 1
