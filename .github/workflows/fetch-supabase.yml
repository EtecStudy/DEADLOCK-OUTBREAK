name: Test Push
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.email "test@test.com"
          git config user.name "Test"
          echo "hello from $(date)" > hello.txt
          git checkout --orphan test-push-minimal
          git add hello.txt
          git commit -m "test push"
          git push -f origin test-push-minimal
          echo "push done"
